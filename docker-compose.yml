version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: costpilot-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: costpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d costpilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - costpilot-network

  redis:
    image: redis:7-alpine
    container_name: costpilot-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - costpilot-network

  api-server:
    build:
      context: .
      dockerfile: ./artifacts/api-server/Dockerfile
    container_name: costpilot-api-server
    ports:
      - '8080:8080'
    environment:
      - PORT=8080
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/costpilot
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - costpilot-network

volumes:
  postgres_data:
    driver: local

networks:
  costpilot-network:
    driver: bridge
