  /workspaces/{id}/members:
    get:
      operationId: listWorkspaceMembers
      tags: [workspaces]
      summary: List all members of a workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMember"

  /workspaces/{id}/invite:
    post:
      operationId: inviteToWorkspace
      tags: [workspaces]
      summary: Invite a user to a workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                role:
                  type: string
                  enum: [admin, viewer]
      responses:
        "201":
          description: Invite sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"

  /workspaces/{id}/leave:
    post:
      operationId: leaveWorkspace
      tags: [workspaces]
      summary: Leave a workspace (the sole owner cannot leave)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Left the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: The caller is the sole owner
        "403":
          description: Not an active member

  /workspaces/members/{memberId}:
    delete:
      operationId: removeMember
      tags: [workspaces]
      summary: Remove a member or revoke a pending invitation (owner/admin)
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Owners cannot be removed
        "403":
          description: Caller may not remove this member
        "404":
          description: Member not found

  /workspaces/accept-invite:
    post:
      operationId: acceptInvite
      tags: [workspaces]
      summary: Accept an invitation with its one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  pattern: "^[a-f0-9]{64}$"
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                type: object
                required: [message, member]
                properties:
                  message:
                    type: string
                  member:
                    $ref: "#/components/schemas/WorkspaceMember"
        "400":
          description: Invite is invalid, expired or already consumed
        "409":
          description: Account already has a membership in this workspace

  /workspaces/invite/{token}:
    get:
      operationId: getInviteByToken
      tags: [workspaces]
      summary: Preview an invitation before accepting it
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: Invite not found

  /webhooks:
    get:
      x-costpilot-availability: disabled  # blocked by the API launch scope (503)
      operationId: listWebhooks
      tags: [webhooks]
      summary: List all configured webhooks for the active workspace
      responses:
        "200":
          description: List of webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
    post:
      x-costpilot-availability: disabled  # blocked by the API launch scope (503)
      operationId: createWebhook
      tags: [webhooks]
      summary: Add a new Slack or Discord webhook
      requestBody:
