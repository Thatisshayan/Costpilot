  /expenses/import-batch:
    post:
      operationId: importExpensesBatch
      tags: [expenses]
      summary: Create up to 500 expenses in one all-or-nothing request
      description: Every row is validated and authorized like a single create. Any invalid row rejects the whole batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactions]
              properties:
                transactions:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: All rows created
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
        "400":
          description: A row failed validation or references a vendor/project outside its scope
        "403":
          description: Not a member with write access to a referenced workspace

  /expenses/search:
    get:
      operationId: searchExpenses
      tags: [expenses]
      summary: Search, filter, sort and page the expenses of one scope
      description: Omit workspaceId for Personal expenses; a workspace id requires active membership (any role). Totals are per currency over all matching rows (not just the page) and never converted.
      parameters:
        - { name: workspaceId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 }, description: "Text in description, category, vendor or project name" }
        - { name: from, in: query, schema: { type: string, format: date }, description: "Earliest expense date (inclusive)" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Latest expense date (inclusive)" }
        - { name: minAmount, in: query, schema: { type: string, pattern: '^-?\d{1,8}(\.\d{1,2})?$' }, description: "Minimum signed amount (credits are negative)" }
        - { name: maxAmount, in: query, schema: { type: string, pattern: '^-?\d{1,8}(\.\d{1,2})?$' }, description: "Maximum signed amount" }
        - { name: platformId, in: query, schema: { type: string, pattern: '^(none|[1-9]\d*)$' }, description: "Vendor id, or none for expenses without a vendor" }
        - { name: projectId, in: query, schema: { type: string, pattern: '^(none|[1-9]\d*)$' }, description: "Project id, or none" }
        - { name: category, in: query, schema: { type: string, maxLength: 100 }, description: "Exact category; empty string for uncategorised" }
        - { name: currency, in: query, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: entryType, in: query, schema: { type: string, enum: [expense, credit] } }
        - { name: sort, in: query, schema: { type: string, enum: [date_desc, date_asc, amount_desc, amount_asc], default: date_desc } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: One page of matching expenses with per-currency totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseSearchResult"
        "400":
          description: Invalid query
        "403":
          description: Not an active member of the requested workspace

  /spend/summary:
    get:
      operationId: getSpendSummary
      tags: [spend]
      summary: Monthly spend for one scope, per currency, with breakdowns and a comparison
      description: |
        Totals are computed in the database from stored expenses, per currency and never converted.
        net = charges (amounts >= 0) + credits (negative amounts). An expense counts in the month of its date.
        The current month runs to today (UTC) and is compared with the same days of the previous month;
        a complete month is compared with the complete previous month. changePercent is null when the
        previous net is zero or negative.
      parameters:
        - { name: workspaceId, in: query, schema: { type: integer, minimum: 1 }, description: "Omit for Personal" }
        - { name: month, in: query, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, description: "YYYY-MM; defaults to the current month. Future months are rejected." }
      responses:
        "200":
          description: Spend summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendSummary"
        "400":
          description: Invalid or future month
        "403":
          description: Not an active member of the requested workspace

