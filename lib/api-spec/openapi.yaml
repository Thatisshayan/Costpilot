  /exports/generate:
    post:
      operationId: generateExpenseExport
      tags: [exports]
      summary: Export recorded expenses for one scope as CSV or PDF
      description: Omit workspaceId (or send null) for personal expenses; a workspace id exports that workspace and requires active membership. Optional filters match GET /expenses/search. Amounts are exact 2-decimal values per row; the PDF adds net totals per currency, never converted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [module, format]
              properties:
                module:
                  type: string
                  enum: [expenses]
                format:
                  type: string
                  enum: [csv, pdf]
                workspaceId:
                  type: integer
                  minimum: 1
                  nullable: true
                filters:
                  $ref: "#/components/schemas/ExpenseFilters"
      responses:
        "200":
          description: Export file (Content-Disposition carries the filename)
          content:
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request body
        "403":
          description: Not an active member of the requested workspace

