openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Expense Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: platforms
  - name: projects
  - name: expenses
  - name: subscriptions
  - name: tools
  - name: credits
  - name: dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /platforms:
    get:
      operationId: listPlatforms
      tags: [platforms]
      summary: List all AI platforms
      responses:
        "200":
          description: List of platforms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Platform"
    post:
      operationId: createPlatform
      tags: [platforms]
      summary: Create a new platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platform"

  /platforms/{id}:
    get:
      operationId: getPlatform
      tags: [platforms]
      summary: Get a platform by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platform"
    patch:
      operationId: updatePlatform
      tags: [platforms]
      summary: Update a platform
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platform"
    delete:
      operationId: deletePlatform
      tags: [platforms]
      summary: Delete a platform
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /platforms/{id}/sync:
    post:
      operationId: syncPlatformUsage
      tags: [platforms]
      summary: Sync usage data from platform API
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    get:
      operationId: getExpense
      tags: [expenses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    patch:
      operationId: updateExpense
      tags: [expenses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/{id}:
    get:
      operationId: getSubscription
      tags: [subscriptions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    patch:
      operationId: updateSubscription
      tags: [subscriptions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    delete:
      operationId: deleteSubscription
      tags: [subscriptions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tools:
    get:
      operationId: listTools
      tags: [tools]
      responses:
        "200":
          description: List of tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tool"
    post:
      operationId: createTool
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"

  /tools/{id}:
    patch:
      operationId: updateTool
      tags: [tools]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
    delete:
      operationId: deleteTool
      tags: [tools]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /credits:
    get:
      operationId: listCreditPurchases
      tags: [credits]
      summary: List all credit top-up purchases
      responses:
        "200":
          description: List of credit purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditPurchase"
    post:
      operationId: createCreditPurchase
      tags: [credits]
      summary: Log a credit top-up purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPurchaseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPurchase"

  /credits/{id}:
    patch:
      operationId: updateCreditPurchase
      tags: [credits]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPurchaseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPurchase"
    delete:
      operationId: deleteCreditPurchase
      tags: [credits]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/expiring-trials:
    get:
      operationId: getExpiringTrials
      tags: [dashboard]
      responses:
        "200":
          description: Expiring subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"

  /dashboard/expenses-by-platform:
    get:
      operationId: getExpensesByPlatform
      tags: [dashboard]
      responses:
        "200":
          description: Expenses per platform
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformExpenseStat"

  /dashboard/expenses-by-project:
    get:
      operationId: getExpensesByProject
      tags: [dashboard]
      responses:
        "200":
          description: Expenses per project
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectExpenseStat"

  /dashboard/monthly-spending:
    get:
      operationId: getMonthlySpending
      tags: [dashboard]
      responses:
        "200":
          description: Monthly spending data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlySpending"

  /dashboard/calendar-events:
    get:
      operationId: getCalendarEvents
      tags: [dashboard]
      summary: All events for calendar view (expenses, trials, renewals, credits)
      responses:
        "200":
          description: Calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"

  /receipts/upload:
    post:
      operationId: uploadReceipt
      tags: [expenses]
      summary: Upload and parse a receipt using Vision AI
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                receipt:
                  type: string
                  format: binary
      responses:
        "200":
          description: Parsed receipt data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptParseResult"

  /analytics/smart-suggestions:
    get:
      operationId: getSmartSuggestions
      tags: [analytics]
      summary: Get AI-driven cost optimization suggestions
      responses:
        "200":
          description: List of suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmartSuggestion"

  /analytics/savings-opportunities:
    get:
      operationId: listSavingsOpportunities
      tags: [analytics]
      summary: Get AI Waste Detection results
      responses:
        "200":
          description: List of savings opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavingsOpportunity"

  /analytics/forecast:
    get:
      operationId: getForecast
      tags: [analytics]
      summary: Get spending and credit exhaustion forecasts
      responses:
        "200":
          description: Forecast data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsForecast"

  /dashboard/kpi-summary:
    get:
      operationId: getKpiSummary
      tags: [dashboard]
      summary: Get high-level KPI metrics for the dashboard
      responses:
        "200":
          description: KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /analytics/export/csv:
    get:
      operationId: exportExpensesCsv
      tags: [analytics]
      summary: Export all expenses as CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List all workspaces the user belongs to
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a new workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceBody"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"

  /workspaces/{id}/members:
    get:
      operationId: listWorkspaceMembers
      tags: [workspaces]
      summary: List all members of a workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMember"

  /workspaces/{id}/invite:
    post:
      operationId: inviteToWorkspace
      tags: [workspaces]
      summary: Invite a user to a workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                role:
                  type: string
                  enum: [admin, viewer]
      responses:
        "201":
          description: Invite sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"

  /webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List all configured webhooks for the active workspace
      responses:
        "200":
          description: List of webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Add a new Slack or Discord webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookBody"
      responses:
        "201":
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"

  /cicd/validate:
    post:
      operationId: validateDeployment
      tags: [cicd]
      summary: Validate a deployment against project budget policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, pipelineName, repository, branch]
              properties:
                projectId: { type: integer }
                pipelineName: { type: string }
                repository: { type: string }
                branch: { type: string }
                estimatedCost: { type: number }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CicdValidationResult"

  /cicd/runs:
    get:
      operationId: listCicdRuns
      tags: [cicd]
      summary: List recent CI/CD pipeline runs
      responses:
        "200":
          description: List of pipeline runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CicdRun"

  /remediation:
    get:
      operationId: listRemediationActions
      tags: [remediation]
      summary: List available remediation actions
      responses:
        "200":
          description: List of actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemediationAction"

  /remediation/execute:
    post:
      operationId: executeRemediation
      tags: [remediation]
      summary: Authorize and execute a remediation action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionId]
              properties:
                actionId: { type: integer }
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }

  /intelligence/query:
    post:
      operationId: postIntelligenceQuery
      tags: [intelligence]
      summary: Ask the AI Co-pilot a question about spend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer: { type: string }
                  data: { type: object }

  /telemetry/gpu:
    get:
      operationId: getTelemetryGpu
      tags: [telemetry]
      summary: Get live GPU cluster utilization telemetry
      responses:
        "200":
          description: GPU telemetry data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GpuTelemetry"

  /telemetry/llm-route:
    post:
      operationId: postTelemetryLlmRoute
      tags: [telemetry]
      summary: Record an LLM routing event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, tokens]
              properties:
                model: { type: string }
                provider: { type: string }
                tokens: { type: integer }
                latency: { type: integer }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /audits:
    get:
      operationId: listAudits
      tags: [audits]
      summary: List all AI infrastructure audits
      responses:
        "200":
          description: List of audits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAudit"

  /audits/scan:
    post:
      operationId: startAuditScan
      tags: [audits]
      summary: Trigger a new AI infrastructure scan
      responses:
        "200":
          description: Scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAudit"

components:
  schemas:
    Workspace:
      type: object
      required: [id, name, slug, ownerId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        ownerId:
          type: string
        createdAt:
          type: string

    CreateWorkspaceBody:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string

    WorkspaceMember:
      type: object
      required: [id, workspaceId, userId, email, role, createdAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        userId:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, viewer]
        createdAt:
          type: string

    Webhook:
      type: object
      required: [id, workspaceId, type, url, name, isActive, events, createdAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        type:
          type: string
          enum: [slack, discord]
        url:
          type: string
        name:
          type: string
        isActive:
          type: boolean
        events:
          type: string
        createdAt:
          type: string

    CreateWebhookBody:
      type: object
      required: [workspaceId, type, url, name]
      properties:
        workspaceId:
          type: integer
        type:
          type: string
          enum: [slack, discord]
        url:
          type: string
        name:
          type: string
        events:
          type: string

    SmartSuggestion:
      type: object
      required: [id, type, title, description, potentialSavings]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [model_swap, subscription_consolidation, unused_credit]
        title:
          type: string
        description:
          type: string
        potentialSavings:
          type: number
        confidence:
          type: number

    AnalyticsForecast:
      type: object
      required: [dailySpendVelocity, predictedMonthlyTotal, creditExhaustionDates]
      properties:
        dailySpendVelocity:
          type: number
        predictedMonthlyTotal:
          type: number
        creditExhaustionDates:
          type: array
          items:
            type: object
            properties:
              platformName:
                type: string
              predictedExhaustionDate:
                type: string
              daysRemaining:
                type: number

    ReceiptParseResult:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/ReceiptParseData"

    ReceiptParseData:
      type: object
      properties:
        amount:
          type: ["number", "null"]
        platform:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Platform:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        website:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        apiKey:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    PlatformInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        website:
          type: string
        logoUrl:
          type: string
        category:
          type: string
        email:
          type: string
