openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Expense Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: platforms
  - name: projects
  - name: expenses
  - name: subscriptions
  - name: tools
  - name: credits
  - name: dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /platforms:
    get:
      operationId: listPlatforms
      tags: [platforms]
      summary: List all AI platforms
      responses:
        "200":
          description: List of platforms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Platform"
    post:
      operationId: createPlatform
      tags: [platforms]
      summary: Create a new platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platform"

  /platforms/{id}:
    get:
      operationId: getPlatform
      tags: [platforms]
      summary: Get a platform by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platform"
    patch:
      operationId: updatePlatform
      tags: [platforms]
      summary: Update a platform
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platform"
    delete:
      operationId: deletePlatform
      tags: [platforms]
      summary: Delete a platform
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /platforms/{id}/sync:
    post:
      operationId: syncPlatformUsage
      tags: [platforms]
      summary: Sync usage data from platform API
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    get:
      operationId: getExpense
      tags: [expenses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    patch:
      operationId: updateExpense
      tags: [expenses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/{id}:
    get:
      operationId: getSubscription
      tags: [subscriptions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    patch:
      operationId: updateSubscription
      tags: [subscriptions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    delete:
      operationId: deleteSubscription
      tags: [subscriptions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tools:
    get:
      operationId: listTools
      tags: [tools]
      responses:
        "200":
          description: List of tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tool"
    post:
      operationId: createTool
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"

  /tools/{id}:
    patch:
      operationId: updateTool
      tags: [tools]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
    delete:
      operationId: deleteTool
      tags: [tools]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /credits:
    get:
      operationId: listCreditPurchases
      tags: [credits]
      summary: List all credit top-up purchases
      responses:
        "200":
          description: List of credit purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditPurchase"
    post:
      operationId: createCreditPurchase
      tags: [credits]
      summary: Log a credit top-up purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPurchaseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPurchase"

  /credits/{id}:
    patch:
      operationId: updateCreditPurchase
      tags: [credits]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPurchaseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPurchase"
    delete:
      operationId: deleteCreditPurchase
      tags: [credits]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/expiring-trials:
    get:
      operationId: getExpiringTrials
      tags: [dashboard]
      responses:
        "200":
          description: Expiring subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"

  /dashboard/expenses-by-platform:
    get:
      operationId: getExpensesByPlatform
      tags: [dashboard]
      responses:
        "200":
          description: Expenses per platform
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformExpenseStat"

  /dashboard/expenses-by-project:
    get:
      operationId: getExpensesByProject
      tags: [dashboard]
      responses:
        "200":
          description: Expenses per project
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectExpenseStat"

  /dashboard/monthly-spending:
    get:
      operationId: getMonthlySpending
      tags: [dashboard]
      responses:
        "200":
          description: Monthly spending data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlySpending"

  /dashboard/calendar-events:
    get:
      operationId: getCalendarEvents
      tags: [dashboard]
      summary: All events for calendar view (expenses, trials, renewals, credits)
      responses:
        "200":
          description: Calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Platform:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        website:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        apiKey:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    PlatformInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        website:
          type: string
        logoUrl:
          type: string
        category:
          type: string
        email:
          type: string
        apiKey:
          type: string
        notes:
          type: string

    PlatformUpdate:
      type: object
      properties:
        name:
          type: string
        website:
          type: string
        logoUrl:
          type: string
        category:
          type: string
        email:
          type: string
        apiKey:
          type: string
        notes:
          type: string

    SyncResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        expensesImported:
          type: integer

    Project:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string

    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        color:
          type: string
        status:
          type: string

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        color:
          type: string
        status:
          type: string

    Expense:
      type: object
      required: [id, amount, date, createdAt]
      properties:
        id:
          type: integer
        platformId:
          type: ["integer", "null"]
        platformName:
          type: ["string", "null"]
        projectId:
          type: ["integer", "null"]
        projectName:
          type: ["string", "null"]
        amount:
          type: number
        currency:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        date:
          type: string
        createdAt:
          type: string

    ExpenseInput:
      type: object
      required: [amount, date]
      properties:
        platformId:
          type: integer
        projectId:
          type: integer
        amount:
          type: number
        currency:
          type: string
        description:
          type: string
        category:
          type: string
        date:
          type: string

    ExpenseUpdate:
      type: object
      properties:
        platformId:
          type: integer
        projectId:
          type: integer
        amount:
          type: number
        currency:
          type: string
        description:
          type: string
        category:
          type: string
        date:
          type: string

    Subscription:
      type: object
      required: [id, platformId, planName, planType, createdAt]
      properties:
        id:
          type: integer
        platformId:
          type: integer
        platformName:
          type: ["string", "null"]
        projectId:
          type: ["integer", "null"]
        projectName:
          type: ["string", "null"]
        planName:
          type: string
        planType:
          type: string
        status:
          type: string
        email:
          type: ["string", "null"]
        trialStartDate:
          type: ["string", "null"]
        trialEndDate:
          type: ["string", "null"]
        renewalDate:
          type: ["string", "null"]
        monthlyCost:
          type: ["number", "null"]
        daysUntilExpiry:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    SubscriptionInput:
      type: object
      required: [platformId, planName, planType]
      properties:
        platformId:
          type: integer
        projectId:
          type: integer
        planName:
          type: string
        planType:
          type: string
        status:
          type: string
        email:
          type: string
        trialStartDate:
          type: string
        trialEndDate:
          type: string
        renewalDate:
          type: string
        monthlyCost:
          type: number
        notes:
          type: string

    SubscriptionUpdate:
      type: object
      properties:
        platformId:
          type: integer
        projectId:
          type: integer
        planName:
          type: string
        planType:
          type: string
        status:
          type: string
        email:
          type: string
        trialStartDate:
          type: string
        trialEndDate:
          type: string
        renewalDate:
          type: string
        monthlyCost:
          type: number
        notes:
          type: string

    Tool:
      type: object
      required: [id, name, url, projectId, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        projectName:
          type: ["string", "null"]
        platformId:
          type: ["integer", "null"]
        platformName:
          type: ["string", "null"]
        name:
          type: string
        url:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        isPinned:
          type: boolean
        createdAt:
          type: string

    ToolInput:
      type: object
      required: [name, url, projectId]
      properties:
        projectId:
          type: integer
        platformId:
          type: integer
        name:
          type: string
        url:
          type: string
        description:
          type: string
        category:
          type: string
        isPinned:
          type: boolean

    ToolUpdate:
      type: object
      properties:
        projectId:
          type: integer
        platformId:
          type: integer
        name:
          type: string
        url:
          type: string
        description:
          type: string
        category:
          type: string
        isPinned:
          type: boolean

    CreditPurchase:
      type: object
      required: [id, platformId, amount, purchaseDate, createdAt]
      properties:
        id:
          type: integer
        platformId:
          type: integer
        platformName:
          type: ["string", "null"]
        projectId:
          type: ["integer", "null"]
        projectName:
          type: ["string", "null"]
        amount:
          type: number
        credits:
          type: ["number", "null"]
        currency:
          type: string
        description:
          type: ["string", "null"]
        purchaseDate:
          type: string
        createdAt:
          type: string

    CreditPurchaseInput:
      type: object
      required: [platformId, amount, purchaseDate]
      properties:
        platformId:
          type: integer
        projectId:
          type: integer
        amount:
          type: number
        credits:
          type: number
        currency:
          type: string
        description:
          type: string
        purchaseDate:
          type: string

    CreditPurchaseUpdate:
      type: object
      properties:
        platformId:
          type: integer
        projectId:
          type: integer
        amount:
          type: number
        credits:
          type: number
        currency:
          type: string
        description:
          type: string
        purchaseDate:
          type: string

    DashboardSummary:
      type: object
      required: [totalSpend, totalPlatforms, totalProjects, activeTrials, expiringTrials, totalTools, totalCredits]
      properties:
        totalSpend:
          type: number
        thisMonthSpend:
          type: number
        lastMonthSpend:
          type: number
        totalPlatforms:
          type: integer
        totalProjects:
          type: integer
        activeTrials:
          type: integer
        expiringTrials:
          type: integer
        totalTools:
          type: integer
        totalCredits:
          type: number

    PlatformExpenseStat:
      type: object
      required: [platformId, platformName, total]
      properties:
        platformId:
          type: integer
        platformName:
          type: string
        total:
          type: number
        count:
          type: integer

    ProjectExpenseStat:
      type: object
      required: [projectId, projectName, total]
      properties:
        projectId:
          type: integer
        projectName:
          type: string
        total:
          type: number
        count:
          type: integer

    MonthlySpending:
      type: object
      required: [month, total]
      properties:
        month:
          type: string
        total:
          type: number

    CalendarEvent:
      type: object
      required: [id, type, title, date]
      properties:
        id:
          type: string
        type:
          type: string
          description: "expense | trial_expiry | renewal | credit_purchase"
        title:
          type: string
        date:
          type: string
        amount:
          type: ["number", "null"]
        platformName:
          type: ["string", "null"]
        projectName:
          type: ["string", "null"]
        urgent:
          type: boolean
