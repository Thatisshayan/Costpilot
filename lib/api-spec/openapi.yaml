components:
  schemas:
    Workspace:
      type: object
      required: [id, name, slug, ownerId, createdAt, onboarded]
      properties:
        role:
          type: string
          enum: [owner, admin, viewer]
          description: The caller's role in this workspace (list and create responses).
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        ownerId:
          type: string
        createdAt:
          type: string
        onboarded:
          type: boolean

    CreateWorkspaceBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          deprecated: true
          description: Ignored. The server generates a unique identifier; display names need not be unique.

    ExpenseFilters:
      type: object
      additionalProperties: false
      properties:
        q: { type: string, minLength: 1, maxLength: 100 }
        from: { type: string, format: date }
        to: { type: string, format: date }
        minAmount: { type: string, pattern: '^-?\d{1,8}(\.\d{1,2})?$' }
        maxAmount: { type: string, pattern: '^-?\d{1,8}(\.\d{1,2})?$' }
        platformId: { type: string, pattern: '^(none|[1-9]\d*)$' }
        projectId: { type: string, pattern: '^(none|[1-9]\d*)$' }
        category: { type: string, maxLength: 100 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        entryType: { type: string, enum: [expense, credit] }

    CurrencyTotal:
      type: object
      required: [currency, net, count]
      properties:
        currency: { type: string }
        net: { type: string, description: "Exact signed amount with 2 decimals" }
        count: { type: integer }

    ExpenseSearchResult:
      type: object
      required: [items, total, limit, offset, totals]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        totals:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyTotal"

    SpendGroup:
      type: object
      required: [name, net, count]
      properties:
        id: { type: ["integer", "null"], description: "Vendor or project id; null for unassigned" }
        name: { type: ["string", "null"], description: "Null for unassigned" }
        net: { type: string }
        count: { type: integer }

    SpendCurrency:
      type: object
      required: [currency, net, charges, credits, count, previousNet, changeAmount, changePercent, byVendor, byProject, byCategory, trend]
      properties:
        currency: { type: string }
        net: { type: string }
        charges: { type: string }
        credits: { type: string, description: "Sum of refunds/credits (zero or negative)" }
        count: { type: integer }
        previousNet: { type: string }
        changeAmount: { type: string }
        changePercent: { type: ["number", "null"], description: "Null when the previous net is zero or negative" }
        byVendor: { type: array, items: { $ref: "#/components/schemas/SpendGroup" } }
        byProject: { type: array, items: { $ref: "#/components/schemas/SpendGroup" } }
        byCategory: { type: array, items: { $ref: "#/components/schemas/SpendGroup" } }
        trend:
          type: array
          items:
            type: object
            required: [month, net]
            properties:
              month: { type: string }
              net: { type: string }

    SpendSummary:
      type: object
      required: [workspaceId, period, comparison, currencies]
      properties:
        workspaceId: { type: ["integer", "null"] }
        period:
          type: object
          required: [month, start, end, through, isPartial]
          properties:
            month: { type: string }
            start: { type: string }
            end: { type: string }
            through: { type: string }
            isPartial: { type: boolean }
        comparison:
          type: object
          required: [month, start, through, basis]
          properties:
            month: { type: string }
            start: { type: string }
            through: { type: string }
            basis: { type: string, enum: [full-month, same-days] }
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/SpendCurrency"

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    InvitePreview:
      type: object
      required: [workspaceName, workspaceSlug, email, status, expiresAt]
      properties:
        workspaceName:
          type: string
        workspaceSlug:
          type: string
        email:
          type: string
        status:
          type: string
        expiresAt:
          type: string

    WorkspaceInvitation:
      type: object
      required: [id, email, role, token, status, inviteUrl]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, viewer]
        token:
          type: string
          description: Private one-time bearer capability. Share only with intended recipients.
        status:
          type: string
          enum: [pending]
        inviteUrl:
          type: string
    WorkspaceMember:
      type: object
      required: [id, workspaceId, userId, email, role, createdAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        userId:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, viewer]
        status:
          type: string
          enum: [active, pending, expired]
        joinedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    Webhook:
      type: object
      required: [id, workspaceId, type, url, name, isActive, events, createdAt]
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        type:
          type: string
          enum: [slack, discord]
        url:
          type: string
        name:
          type: string
        isActive:
          type: boolean
        events:
          type: string
        createdAt:
          type: string

    CreateWebhookBody:
      type: object
      required: [workspaceId, type, url, name]
      properties:
        workspaceId:
          type: integer
        type:
          type: string
          enum: [slack, discord]
        url:
          type: string
        name:
          type: string
        events:
          type: string

    SmartSuggestion:
      type: object
      required: [id, type, title, description, potentialSavings]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [model_swap, subscription_consolidation, unused_credit]
        title:
          type: string
        description:
          type: string
        potentialSavings:
          type: number
        confidence:
          type: number

    AnalyticsForecast:
      type: object
      required: [dailySpendVelocity, predictedMonthlyTotal, creditExhaustionDates]
      properties:
        dailySpendVelocity:
          type: number
        predictedMonthlyTotal:
          type: number
        creditExhaustionDates:
