name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=moderate

      - name: Build Libraries & Generate API Client
        run: |
          pnpm --filter "@workspace/api-spec" run codegen
          pnpm -r build

      - name: Run tests
        run: |
          pnpm --filter "@workspace/api-server" run test
          pnpm --filter "@workspace/ai-tracker" run test

      - name: Build Frontend
        env:
          NODE_ENV: production
          BASE_PATH: /Costpilot/
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
        run: |
          test -n "$VITE_CLERK_PUBLISHABLE_KEY" || { echo "Missing repository variable VITE_CLERK_PUBLISHABLE_KEY"; exit 1; }
          case "$VITE_API_ORIGIN" in
            https://*) ;;
            *) echo "VITE_API_ORIGIN must be an HTTPS API origin"; exit 1 ;;
          esac
          pnpm --filter "@workspace/ai-tracker" run build

      - name: Verify Build
        run: |
          ls -R artifacts/ai-tracker/dist/public
          if [ ! -f artifacts/ai-tracker/dist/public/index.html ]; then
            echo "Error: index.html not found!"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/ai-tracker/dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
