name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: actions/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline

      - name: Run security audit
        run: pnpm audit --audit-level=moderate || true

      - name: Build Libraries & Generate API Client
        run: |
          pnpm --filter "@workspace/api-spec" run codegen
          pnpm -r build

      - name: Run tests
        run: |
          pnpm --filter "@workspace/api-server" run test
          pnpm --filter "@workspace/ai-tracker" run test

      - name: Build Frontend
        env:
          NODE_ENV: production
          BASE_PATH: /Costpilot/
        run: pnpm --filter "@workspace/ai-tracker" run build

      - name: Verify Build
        run: |
          ls -R artifacts/ai-tracker/dist/public
          if [ ! -f artifacts/ai-tracker/dist/public/index.html ]; then
            echo "Error: index.html not found!"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/ai-tracker/dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4