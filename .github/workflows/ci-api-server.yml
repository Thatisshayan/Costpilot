name: CI - API Server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: costpilot
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Libraries
        run: pnpm run typecheck:libs

      - name: Typecheck API Server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build API Server
        run: pnpm --filter @workspace/api-server run build

      - name: Run API Server Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/costpilot
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          JWT_SECRET: stub-jwt-secret-at-least-32-chars-long
          CLERK_SECRET_KEY: test_key
          STRIPE_SECRET_KEY: sk_test_stub
          WEBHOOK_SECRET: stub-secret-at-least-32-chars-long
        run: pnpm --filter @workspace/api-server run test

      - name: Run DB Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/costpilot
        run: pnpm --filter @workspace/db run test
