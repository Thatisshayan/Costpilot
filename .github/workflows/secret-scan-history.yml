name: secret-scan-history

# Weekly full-history gitleaks scan, in addition to the per-PR/push range scan
# in the governance gate. Fails closed; exceptions only via exact fingerprints
# in .gitleaksignore.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        env:
          # SHA-256 of gitleaks_8.21.2_linux_x64.tar.gz from the official release checksums file.
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full history and current files
        env:
          SECRET_SCAN_RANGE: full
        run: node scripts/secret-scan.mjs
